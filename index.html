
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TORQUE CREW</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#08080a;
  --bg-deep:#0e0505;
  --red:#ff2130;
  --red-dim:#8c141c;
  --red-glow:rgba(255,33,48,0.35);
  --ink:#f2f0ee;
  --ink-dim:#9c9794;
  --ink-faint:#5e5a58;
  --line:rgba(255,255,255,0.08);
  --line-red:rgba(255,33,48,0.25);
  --card:#0f0d0d;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  letter-spacing:0.01em;
  text-transform:uppercase;
  line-height:1.05;
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* ---------- background texture ---------- */
.field{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, var(--red-glow), transparent 60%),
    radial-gradient(ellipse 50% 30% at 85% 60%, rgba(255,33,48,0.12), transparent 60%),
    var(--bg);
}
.field::before{
  content:'';
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, black, transparent 75%);
}
.spark{position:absolute;width:2px;height:2px;background:#ff8a90;border-radius:50%;opacity:0;animation:twinkle 4s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0;}50%{opacity:0.9;}}
@keyframes spin-slow{from{transform:rotateY(0deg);}to{transform:rotateY(360deg);}}

/* ---------- intro loader ---------- */
#loader{
  position:fixed; inset:0; z-index:100;
  background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .7s ease, visibility .7s ease;
}
#loader.hide{opacity:0; visibility:hidden;}
.intro-video{display:block;width:auto;height:auto;max-width:100vw;max-height:100vh;object-fit:contain;background:#000;}
@media (max-aspect-ratio: 16/10){.intro-video{width:100vw;height:auto;}}
@media (min-aspect-ratio: 16/10){.intro-video{height:100vh;width:auto;}}
.loader-skip{
  position:absolute; top:18px; right:18px;
  font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600; letter-spacing:0.12em;
  color:var(--ink-dim); border:1px solid var(--line); border-radius:100px; padding:8px 16px;
  background:rgba(0,0,0,0.4); z-index:2;
}
.loader-enter{
  position:absolute; bottom:14%; left:50%; transform:translateX(-50%) translateY(10px);
  font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; letter-spacing:0.1em;
  padding:15px 30px; border-radius:100px; color:#fff;
  background:linear-gradient(135deg,#ff2130,#c8121f); box-shadow:0 8px 30px -8px var(--red-glow);
  opacity:0; pointer-events:none; transition:opacity .5s ease, transform .5s ease;
  z-index:2;
}
.loader-enter.show{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0);}

/* ---------- nav ---------- */
nav{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px clamp(20px,5vw,64px);
  background:rgba(8,8,10,0.75); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; text-align:left; font:inherit;}
.brand-mark{width:32px;height:32px;animation:spin-slow 10s linear infinite;}
.brand-word{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:19px; letter-spacing:0.04em;}
.brand-word span{color:var(--red);}
.nav-links{display:none; gap:32px; font-size:14px; color:var(--ink-dim); font-weight:500;}
.nav-links button, .brand, .menu-item, .btn{background:none; border:0; -webkit-appearance:none; appearance:none;}
.nav-links button{color:var(--ink-dim); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer;}
.nav-links button:hover{color:var(--ink);}
@media(min-width:860px){.nav-links{display:flex;}}
.burger{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;z-index:70;}

/* ---------- mobile menu overlay ---------- */
#menuOverlay{
  position:fixed; inset:0; z-index:60;
  background:
    radial-gradient(ellipse 70% 45% at 50% 0%, var(--red-glow), transparent 60%),
    var(--bg);
  display:flex; flex-direction:column;
  padding:24px clamp(20px,6vw,64px) 36px;
  opacity:0; visibility:hidden; transform:translateY(-8px);
  transition:opacity .35s ease, visibility .35s ease, transform .35s ease;
}
#menuOverlay.open{opacity:1; visibility:visible; transform:translateY(0);}
.menu-top{display:flex; align-items:center; justify-content:space-between;}
.menu-close{width:38px;height:38px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;}
.menu-items{flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px;}
.menu-item{
  display:flex; align-items:baseline; gap:14px; padding:18px 4px; border-bottom:1px solid var(--line);
  font-family:'Rajdhani',sans-serif; text-transform:uppercase; width:100%; text-align:left; cursor:pointer; color:inherit; font-size:inherit;
}
.menu-item:first-child{border-top:1px solid var(--line);}
.menu-num{font-size:13px; font-weight:600; color:var(--red); letter-spacing:0.1em;}
.menu-label{flex:1; font-size:clamp(22px,7vw,32px); font-weight:700; color:var(--ink); letter-spacing:0.01em;}
.menu-arrow{font-size:20px; color:var(--ink-faint); transition:transform .2s ease, color .2s ease;}
.menu-item:active .menu-arrow, .menu-item:hover .menu-arrow{color:var(--red); transform:translateX(4px);}
.menu-socials{display:flex; gap:12px; justify-content:center; margin-top:28px;}
.menu-social-btn{
  display:flex; align-items:center; gap:9px; border:1px solid var(--line); border-radius:100px;
  padding:11px 18px; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.06em; color:var(--ink-dim);
}

/* ---------- hero ---------- */
.hero{position:relative; padding:64px clamp(20px,6vw,64px) 40px; text-align:center; overflow:hidden;}
.hero-mark-wrap{display:flex;justify-content:center;margin:8px auto 20px;}
.hero-mark{width:min(52vw,220px); animation:spin-slow 8s linear infinite; filter:drop-shadow(0 0 40px var(--red-glow));}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px;}
.chip{
  font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600; letter-spacing:0.14em;
  border:1px solid var(--line); padding:7px 14px; border-radius:100px; color:var(--ink-dim);
}
.badge{
  display:inline-flex; align-items:center; gap:8px;
  border:1px solid var(--line-red); border-radius:100px; padding:8px 18px 8px 14px;
  font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.12em; color:#ffb3b8;
  margin-bottom:22px;
}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);}
.hero h1{font-size:clamp(38px,9vw,72px); margin-bottom:20px;}
.hero h1 .accent{color:var(--red);}
.hero p.lede{
  max-width:480px; margin:0 auto 34px; color:var(--ink-dim); font-size:16px; line-height:1.65;
}
.btn-row{display:flex; flex-direction:column; gap:14px; align-items:center;}
.btn{
  font-family:'Rajdhani',sans-serif; font-weight:600; font-size:15px; letter-spacing:0.06em;
  padding:16px 30px; border-radius:100px; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  width:min(100%,320px); transition:transform .2s ease, box-shadow .2s ease; cursor:pointer; color:inherit;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,#ff2130,#c8121f); color:#fff; box-shadow:0 8px 30px -8px var(--red-glow);}
.btn-ghost{border:1px solid var(--line); color:var(--ink);}
.btn-ig{display:inline-flex; align-items:center; gap:9px;}

/* ---------- section shell ---------- */
section{position:relative; padding:56px clamp(20px,6vw,64px); max-width:1100px; margin:0 auto;}
@media(min-width:640px){section{padding:88px clamp(20px,6vw,64px);}}
.eyebrow{
  display:flex; align-items:center; gap:10px; margin-bottom:18px;
  font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:600; letter-spacing:0.16em; color:var(--red);
}
.eyebrow::before{content:'';width:24px;height:2px;background:var(--red);}
.sec-title{font-size:clamp(28px,6vw,44px); margin-bottom:20px; max-width:640px;}
.sec-title .accent{color:var(--red);}
.sec-lede{color:var(--ink-dim); font-size:16px; line-height:1.7; max-width:560px; margin-bottom:36px;}

/* mission card */
.mission-card{
  border:1px solid var(--line-red); border-radius:18px; padding:32px;
  background:linear-gradient(160deg, rgba(255,33,48,0.08), transparent 60%);
}
.mission-card h3{font-size:24px; margin-bottom:16px; color:#fff;}
.mission-card p{color:var(--ink-dim); line-height:1.7; margin-bottom:18px;}
blockquote{
  border-left:2px solid var(--red); padding-left:18px; margin-top:22px;
  font-style:italic; color:#e8e4e2; line-height:1.6; font-size:15px;
}

/* ---------- roster ---------- */
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:34px;}
.tab{
  font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.06em;
  padding:10px 16px; border-radius:100px; border:1px solid var(--line); color:var(--ink-dim);
  background:transparent; transition:all .2s ease;
}
.tab.active{background:var(--red); border-color:var(--red); color:#fff;}
.roster-grid{display:grid; grid-template-columns:1fr; gap:20px;}
@media(min-width:640px){.roster-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.roster-grid{grid-template-columns:1fr 1fr 1fr;}}
.card{
  border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--card);
  transition:border-color .25s ease, transform .25s ease; display:flex; flex-direction:column;
}
.card.hidden{display:none;}
.card:hover{border-color:var(--line-red); transform:translateY(-3px);}
.photo{
  aspect-ratio:4/5; position:relative; overflow:hidden;
  background:linear-gradient(160deg,#1a0c0d,#0a0708);
}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;}
.photo::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,0.05) 55%, rgba(10,7,7,0.75) 100%);
}
.tagpill{
  position:absolute; top:12px; left:12px; font-family:'Rajdhani',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:0.1em; background:rgba(0,0,0,0.55); border:1px solid var(--line-red); color:#ffb3b8;
  padding:5px 10px; border-radius:100px; backdrop-filter:blur(4px);
}
.idtag{
  position:absolute; top:12px; right:12px; font-family:'Rajdhani',sans-serif; font-size:10px; font-weight:600;
  color:rgba(255,255,255,0.55);
}
.card-body{padding:18px 18px 20px; flex:1; display:flex; flex-direction:column;}
.card-body h4{font-size:17px; font-weight:700; letter-spacing:0.02em; margin-bottom:3px; font-family:'Rajdhani',sans-serif; text-transform:uppercase;}
.role{color:var(--red); font-size:12px; font-weight:600; letter-spacing:0.08em; font-family:'Rajdhani',sans-serif; text-transform:uppercase; margin-bottom:10px;}
.bio{color:var(--ink-dim); font-size:13.5px; line-height:1.6; flex:1; margin-bottom:14px;}
.card-foot{display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line); padding-top:12px; gap:8px;}
.ig-link{display:flex; align-items:center; gap:7px; font-family:'Rajdhani',sans-serif; font-size:12.5px; font-weight:600; color:var(--ink-dim); transition:color .2s ease;}
.ig-link:hover{color:#ff5058;}
.ig-link svg{flex-shrink:0;}
.card-id{font-size:10px;color:var(--ink-faint);font-family:'Rajdhani',sans-serif;letter-spacing:0.06em;}

/* ---------- feature blocks ---------- */
.feat{
  border:1px solid var(--line); border-radius:16px; padding:30px; margin-bottom:18px;
  background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
}
.feat-tag{font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:0.14em; color:var(--ink-faint); margin-bottom:18px;}
.feat svg{width:100%; max-width:260px; display:block; margin:0 auto 22px;}
.feat h3{font-size:22px; margin-bottom:10px;}
.feat p{color:var(--ink-dim); line-height:1.6; font-size:14.5px;}

/* ---------- process ---------- */
.steps{display:flex; flex-direction:column; gap:16px;}
.step{border-left:2px solid var(--red); padding:18px 0 18px 22px; position:relative;}
.step-tag{font-family:'Rajdhani',sans-serif; font-size:11px; font-weight:700; letter-spacing:0.12em; color:var(--red); margin-bottom:8px;}
.step h3{font-size:20px; margin-bottom:8px;}
.step p{color:var(--ink-dim); font-size:14.5px; line-height:1.6;}

/* ---------- CTA / socials ---------- */
.cta-sec{text-align:center;}
.cta-sec .eyebrow{justify-content:center;}
.cta-sec .eyebrow::before{display:none;}
.cta-sec .sec-title{margin:0 auto 18px;}
.cta-sec .sec-lede{margin:0 auto 34px;}
.social-row{display:flex; flex-direction:column; gap:12px; max-width:420px; margin:0 auto 30px;}
.social-card{
  display:flex; align-items:center; gap:14px; border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  background:var(--card); text-align:left;
}
.social-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,33,48,0.1);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.social-meta{flex:1;}
.social-meta .handle{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:14.5px;}
.social-meta .label{color:var(--ink-faint); font-size:11.5px; letter-spacing:0.04em; margin-top:2px;}
.follow-btn{font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600; letter-spacing:0.06em; border:1px solid var(--line); border-radius:100px; padding:7px 14px; color:var(--ink);}

footer{border-top:1px solid var(--line); padding:30px clamp(20px,6vw,64px); text-align:center; color:var(--ink-faint); font-size:12.5px;}

/* ---------- roadmap view ---------- */
#roadmapView{display:none;}
#roadmapView.show{display:block;}
.rm-topbar{padding:18px clamp(20px,6vw,64px) 0;position:relative;z-index:1;}
.rm-hero{position:relative;padding:48px clamp(20px,6vw,64px) 34px;text-align:center;}
.rm-h1{font-family:'Rajdhani',sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(34px,9vw,64px);line-height:1.08;margin:18px auto;max-width:900px;}
.rm-lede{max-width:650px;margin:0 auto;color:var(--ink-dim);font-size:16px;line-height:1.7;}
.rm-content{max-width:760px;margin:0 auto;padding:10px clamp(20px,6vw,64px) 70px;}
.rm-block{position:relative;padding-left:44px;margin-bottom:42px;opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;}
.rm-block.in{opacity:1;transform:translateY(0);}
.rm-block::before{content:'';position:absolute;left:8px;top:5px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--red);box-shadow:0 0 16px var(--red-glow);}
.rm-block::after{content:'';position:absolute;left:17px;top:25px;bottom:-42px;width:2px;background:rgba(255,33,48,.35);}
.rm-block:last-child::after{display:none;}
.rm-date{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--red);margin-bottom:10px;}
.rm-card{border:1px solid var(--line);border-radius:16px;padding:22px 20px;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent);}
.rm-card p{color:var(--ink-dim);font-size:14.5px;line-height:1.75;margin-bottom:14px;}
.rm-card p:last-child{margin-bottom:0;}
.rm-card .rm-lead{color:#e8e4e2;font-size:16px;font-weight:500;}
.rm-card ul{color:var(--ink-dim);font-size:14.5px;line-height:1.8;margin:8px 0 14px 20px;}
.rm-card li{margin-bottom:3px;}
.rm-final{text-align:center;padding:10px clamp(20px,6vw,64px) 80px;max-width:760px;margin:0 auto;}
.rm-final p{color:var(--ink-dim);font-size:15px;line-height:1.75;margin-bottom:18px;}
.rm-slogan{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(19px,5vw,26px);letter-spacing:.04em;line-height:1.4;}

/* ---------- journey view ---------- */
#journeyView{display:none;}
#journeyView.show{display:block;}
.jy-topbar{padding:18px clamp(20px,6vw,64px) 0; position:relative; z-index:1;}
.back-link{display:inline-flex; align-items:center; gap:8px; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:12.5px; letter-spacing:0.06em; color:var(--ink-dim); border:1px solid var(--line); border-radius:100px; padding:9px 16px; background:transparent; white-space:nowrap;}
.jy-hero{position:relative; padding:48px clamp(20px,6vw,64px) 40px; text-align:center;}
.jy-h1{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:clamp(34px,9vw,64px); line-height:1.08; margin:18px 0;}
.jy-lede{max-width:520px; margin:0 auto; color:var(--ink-dim); font-size:16px; line-height:1.7;}
.jy-intro{max-width:640px; margin:0 auto; padding:10px clamp(20px,6vw,64px) 50px;}
.jy-intro p{color:var(--ink-dim); font-size:15.5px; line-height:1.85; margin-bottom:16px;}
.jy-intro p.jy-lead-line{color:#e8e4e2; font-size:17px; font-weight:500;}
.jy-timeline{position:relative; padding:20px clamp(20px,6vw,64px) 70px; max-width:760px; margin:0 auto;}
.jy-rail{position:absolute; left:calc(clamp(20px,6vw,64px) + 17px); top:20px; bottom:70px; width:2px; background:linear-gradient(180deg, var(--red), rgba(255,33,48,0.05));}
.jy-milestone{position:relative; padding-left:44px; margin-bottom:56px; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;}
.jy-milestone.in{opacity:1; transform:translateY(0);}
.jy-milestone:last-child{margin-bottom:0;}
.jy-node{position:absolute; left:8px; top:4px; width:20px; height:20px; border-radius:50%; background:var(--bg); border:2px solid var(--red); box-shadow:0 0 16px var(--red-glow); display:flex; align-items:center; justify-content:center;}
.jy-node::after{content:''; width:7px; height:7px; border-radius:50%; background:var(--red);}
.jy-date{font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:700; letter-spacing:0.14em; color:var(--red); margin-bottom:10px;}
.jy-card{border:1px solid var(--line); border-radius:16px; padding:22px 20px; background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent);}
.jy-card p{color:var(--ink-dim); font-size:14.5px; line-height:1.75; margin-bottom:12px;}
.jy-card p.emph{color:#e8e4e2;}
.jy-card p:last-child{margin-bottom:0;}
.jy-milestone.now .jy-card{border-color:var(--line-red); background:linear-gradient(160deg, rgba(255,33,48,0.08), transparent 60%);}
.jy-milestone.now .jy-node{background:var(--red);}
.jy-milestone.now .jy-node::after{background:#fff;}
.jy-closing{text-align:center; padding:20px clamp(20px,6vw,64px) 70px; max-width:640px; margin:0 auto;}
.jy-h2{font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; font-size:clamp(24px,6vw,38px); margin:16px 0 18px;}
.jy-closing p{color:var(--ink-dim); font-size:15px; line-height:1.75; margin-bottom:30px;}
.jy-slogan{font-family:'Rajdhani',sans-serif; font-weight:700; font-size:clamp(19px,5vw,26px); letter-spacing:0.04em; line-height:1.4;}
.jy-cta-row{margin-top:32px; display:flex; justify-content:center;}
.jy-cta-row .btn{width:min(100%,320px);}

/* ===== TORQUE CREW SIGNIFICANT UPGRADE ===== */
.hero{min-height:min(760px,calc(100vh - 70px));display:flex;flex-direction:column;justify-content:center;align-items:center;pad
